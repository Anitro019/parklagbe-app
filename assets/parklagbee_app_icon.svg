<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Slate Gray Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Electric Neon Blue to Emerald Green Gradient for Symbol -->
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <!-- Rim Highlight Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#00E676" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Inner Cutout Fill -->
    <linearGradient id="innerCutout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glossy Reflex Overlay -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00F0FF" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#00E676" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 1. Dark Slate Gray iOS 18 / Material 3 Squircle Frame -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" filter="url(#shadowGlow)"/>

  <!-- Rim Highlight Stroke -->
  <rect x="2" y="2" width="508" height="508" rx="113" ry="113" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- 2. Glossy Reflex Top Layer -->
  <path d="M 0 115 Q 256 60 512 115 L 512 0 L 0 0 Z" fill="url(#glossGrad)"/>

  <!-- 3. Integrated Symbol: Location Pin + Capital "P" + Car / Slot Emblem -->
  <!-- Outer Location Pin Silhouette -->
  <path d="M 124 160 C 124 60 388 60 388 160 C 388 240 C 310 320 C 256 420 256 420 C 256 420 202 320 124 240 C 124 200 124 160 124 160 Z" fill="url(#symbolGrad)"/>

  <!-- Inner Cutout forming "P" Loop & Pin Hole -->
  <circle cx="264" cy="160" r="56" fill="url(#innerCutout)"/>

  <!-- 4. Minimalist Car / Parking Slot Accent inside the "P" Loop -->
  <path d="M 234 168 Q 264 136 294 168 M 230 168 L 298 168" fill="none" stroke="url(#symbolGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Minimalist Car Wheels -->
  <circle cx="248" cy="176" r="4" fill="#00E676"/>
  <circle cx="280" cy="176" r="4" fill="#00E676"/>
</svg>
